name: "Enterprise Release CI"

# 推版本 tag(v*) 或 push 到 dev 时触发
on:
  push:
    tags:
      - "v*"
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============ 1. 后端代码风格 (ruff) ============
  lint:
    name: "Lint (ruff, 全量)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.13.5"
      - name: Clean python cache
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + || true
          find . -name "*.pyc" -delete || true
      - name: uv.lock 一致性
        run: uv lock --check || (echo "❌ uv.lock out of sync. Run 'uv lock' locally and commit." && exit 1)
      - name: Install dependencies
        run: uv sync --frozen --group proxy-dev --group e2e-dev
      - name: Generate Prisma client
        env:
          PRISMA_BINARY_CACHE_DIR: ${{ runner.temp }}/prisma-cache
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma
      - name: Ruff format check
        run: |
          cd litellm && uv run --no-sync ruff format --check . ; cd ..
      - name: Ruff check
        run: |
          cd litellm && uv run --no-sync ruff check . ; cd ..

  # ============ 2. 后端单测 (fork 关键路径 + 管理接口) ============
  backend-unit:
    name: "后端单测 (pytest, fork 关键路径)"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: llmproxy
          POSTGRES_PASSWORD: dbpassword9090
          POSTGRES_DB: litellm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmproxy -d litellm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://llmproxy:dbpassword9090@localhost:5432/litellm
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.13.5"
      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-
      - name: Install dependencies
        run: ./.github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra google --extra proxy --extra semantic-router --extra saml
      - name: Generate Prisma client
        env:
          PRISMA_BINARY_CACHE_DIR: ${{ runner.temp }}/prisma-cache
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma
      - name: Prepare test database
        env:
          PRISMA_BINARY_CACHE_DIR: ${{ runner.temp }}/prisma-cache
        run: uv run --no-sync prisma db push --schema litellm/proxy/schema.prisma --skip-generate --accept-data-loss
      - name: Run tests (fork 关键路径)
        run: |
          uv run --no-sync pytest \
            tests/unit/proxy/management_endpoints/management_v1 \
            tests/unit/proxy/management_endpoints/test_key_management_endpoints.py \
            tests/unit/test_rate_limit_error_unification.py \
            tests/unit/proxy/response_api_endpoints/test_endpoints.py \
            tests/proxy_behavior/management/test_channel_monitor_summary.py \
            tests/unit/proxy/db/test_daily_spend_date_timezone.py \
            tests/unit/litellm_proxy_extras/test_litellm_proxy_extras_utils.py \
            tests/unit/litellm_core_utils/test_streaming_chunk_builder_utils.py \
            --tb=short -q --maxfail=10 -n 2 --reruns 2 --reruns-delay 1 --durations=20

  # ============ 3. 前端 build ============
  ui-build:
    name: "前端 UI build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui/litellm-dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/litellm-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: 校验签入的 UI 产物 (无冲突标记 + chunk 自洽)
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/assert_ui_bundle.sh

  # ============ 4. 前端 lint (全量 prettier + eslint) ============
  ui-lint:
    name: "前端 lint (prettier + eslint)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui/litellm-dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/litellm-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prettier check (全量)
        run: npx prettier --check "src/**/*.{ts,tsx,js,jsx}" || (echo "❌ 有未格式化的前端文件, 运行 npm run format" && exit 1)
      - name: ESLint (全量)
        run: npx eslint "src/**/*.{ts,tsx,js,jsx}" || (echo "❌ ESLint 有报错" && exit 1)

  # ============ 5. 前端单测 (Vitest) ============
  ui-unit:
    name: "前端单测 (Vitest)"
    runs-on: ubuntu-latest
    # The full dashboard suite runs ~15-20 min cold on a GitHub runner; the
    # previous 20 min budget cancelled healthy runs at the wire.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ui/litellm-dashboard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/litellm-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        env:
          CI: "true"
        run: npm run test -- --run --pool forks

  # ============ 6. 前后端类型一致性 ============
  api-types:
    name: "API 类型一致性 (schema.d.ts)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.13.5"
      - name: Install backend deps
        run: ./.github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra google --extra proxy --extra semantic-router
      - name: Generate Prisma client
        env:
          PRISMA_BINARY_CACHE_DIR: ${{ runner.temp }}/prisma-cache
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/litellm-dashboard/package-lock.json
      - name: Install dashboard deps
        working-directory: ui/litellm-dashboard
        run: npm ci
      - name: Regenerate types from live spec
        working-directory: ui/litellm-dashboard
        env:
          LITELLM_PYTHON: "uv run --no-sync python"
        run: npm run gen:api
      - name: Fail if types are stale
        run: |
          if ! git diff --exit-code -- ui/litellm-dashboard/src/lib/http/schema.d.ts; then
            echo "::error file=ui/litellm-dashboard/src/lib/http/schema.d.ts::Generated API types out of sync with proxy OpenAPI spec. 运行: npm run gen:api"
            exit 1
          fi
